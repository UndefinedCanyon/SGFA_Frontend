name: CD (Azure)

# Publica la imagen del frontend y actualiza ese contenedor en la VM de Azure.
# Requiere la variable de repositorio VITE_API_URL (p. ej. https://TU-DOMINIO/api)
# y los secrets VM_HOST y VM_SSH_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: despliegue-azure-frontend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    name: Construir y publicar la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dueño en minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ghcr.io/${{ env.OWNER }}/sgfa-frontend:latest
            ghcr.io/${{ env.OWNER }}/sgfa-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Actualizar el frontend en la VM
    needs: imagen
    runs-on: ubuntu-latest
    steps:
      - name: Preparar SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Actualizar el contenedor
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ vars.VM_USER || 'azureuser' }}
        run: |
          ssh -i ~/.ssh/vm_key "$VM_USER@$VM_HOST" '
            set -e
            cd ~/sgfa
            docker compose -f docker-compose.prod.yml pull frontend
            docker compose -f docker-compose.prod.yml up -d frontend caddy
            docker image prune -f
          '
