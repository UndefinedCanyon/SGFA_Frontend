name: CI

on:
  push:
    branches: [desarrollo, preproduccion, main]
  pull_request:
    branches: [desarrollo, preproduccion, main]

jobs:
  construccion:
    name: Compilar con Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api

  imagen:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: construccion
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen del frontend
        run: docker build -t sgfa-frontend:${{ github.sha }} .