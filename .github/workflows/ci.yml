name: CI

on:
  push:
    branches: [desarrollo, preproduccion, main]
  pull_request:
    branches: [desarrollo, preproduccion, main]

jobs:
  calidad:
    name: Lint, pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (ESLint)
        run: npm run lint

      - name: Pruebas unitarias con cobertura
        run: npm run coverage

      - name: Compilar
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api

      - name: Guardar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura-frontend
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  imagen:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen del frontend
        run: docker build -t sgfa-frontend:${{ github.sha }} .
